version: 0.2

env:
  variables:
    nodeversion: 18
    pythonversion: 3.10
  
  parameter-store:
    AWS_ACCESS_KEY_ID: /CodeBuild/AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: /CodeBuild/AWS_SECRET_ACCESS_KEY

phases:
  install:
    runtime-versions:
      python: $pythonversion
      nodejs: $nodeversion
  
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - docker login -u AWS -p $(aws ecr get-login-password --region $AWS_DEFAULT_REGION) $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com > /dev/null 2>&1
      - export PIPELINE_NAME=`echo $CODEBUILD_INITIATOR | cut -c14-`
      - export ID=$(aws codepipeline get-pipeline-state --region $AWS_DEFAULT_REGION --name $PIPELINE_NAME --query 'stageStates[?actionStates[?latestExecution.externalExecutionId==`'${CODEBUILD_BUILD_ID}'`]].latestExecution.pipelineExecutionId' --output text)
      - export TRIGGER_REPO=$(aws codepipeline list-pipeline-executions --pipeline-name $PIPELINE_NAME | jq -r ".pipelineExecutionSummaries[]|select(.pipelineExecutionId==\"$ID\")|.trigger.triggerDetail | fromjson? | .repositoryId // empty")

  build:
    commands:
      - bash scripts/ci.sh
      - bash scripts/docker_build_push.sh
      - bash scripts/copy_data_manifest.sh

artifacts:
  files:
    - '**/*'
  secondary-artifacts:
    BuildOutputCDK:
      base-directory: $CODEBUILD_SRC_DIR
      files:
        - '**/*'
      exclude-paths:
        - '*/**/*/.venv/**/*' 
        - '*/**/*/*_cache*/**/*'
    BuildOutputML:
      base-directory: $CODEBUILD_SRC_DIR_SourceMLCodeOutput
      files:
        - '**/*'
      exclude-paths:
        - '.venv/**/*'
        - '*_cache*/**/*'
        - '*/.venv/**/*'
        - '*/*_cache*/**/*'
