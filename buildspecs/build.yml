version: 0.2

env:
  variables:
    nodeversion: 18
    pythonversion: 3.10

phases:
  install:
    runtime-versions:
      python: $pythonversion
      nodejs: $nodeversion
  
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - docker login -u AWS -p $(aws ecr get-login-password --region $AWS_DEFAULT_REGION) $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com > /dev/null 2>&1
      - export PIPELINE_NAME=`echo $CODEBUILD_INITIATOR | cut -c14-`

  build:
    commands:
      - bash scripts/ci.sh -c "$CONFIG_S3_PATH"
      - bash scripts/docker_build_push.sh -c "$PIPELINE_NAME" -e "$ECR_REPOSITORY_NAME"
      - bash scripts/copy_data_manifest.sh
      - |
          if [[ -z "$ITEMS_COUNT" ]]; then
            echo "Error: ITEMS_COUNT environment variable is not set."
            exit 1
          fi
          
          if [[ "$ITEMS_COUNT" -le 0 ]]; then
            echo "Items array is empty, stopping pipeline execution."
            CODEPIPELINE_EXECUTION_ID=$(aws codepipeline list-pipeline-executions --pipeline-name "$PIPELINE_NAME" --max-results 1 | jq -r ".pipelineExecutionSummaries[].pipelineExecutionId")
            aws codepipeline stop-pipeline-execution \
              --pipeline-name "$PIPELINE_NAME" \
              --pipeline-execution-id "$CODEPIPELINE_EXECUTION_ID" \
              --region "$AWS_DEFAULT_REGION" \
              --reason "Items array is empty in manifest."
            exit 0
          fi
      - echo "Items array is valid, proceeding with MLPipeline steps..."

artifacts:
  files:
    - '**/*'
  secondary-artifacts:
    BuildOutputCDK:
      base-directory: $CODEBUILD_SRC_DIR
      files:
        - '**/*'
      exclude-paths:
        - '*/**/*/.venv/**/*' 
        - '*/**/*/*_cache*/**/*'
    BuildOutputML:
      base-directory: $CODEBUILD_SRC_DIR_SourceMLCodeOutput
      files:
        - '**/*'
      exclude-paths:
        - '.venv/**/*'
        - '*_cache*/**/*'
        - '*/.venv/**/*'
        - '*/*_cache*/**/*'
