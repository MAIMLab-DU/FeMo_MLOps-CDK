version: 0.2

env:
  variables:
    nodeversion: 18
    pythonversion: 3.10

phases:
  install:
    runtime-versions:
      python: $pythonversion
      nodejs: $nodeversion
  
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - docker login -u AWS -p $(aws ecr get-login-password --region $AWS_DEFAULT_REGION) $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com > /dev/null 2>&1
      - export PIPELINE_NAME=`echo $CODEBUILD_INITIATOR | cut -c14-`

  build:
    commands:
      - bash scripts/ci.sh -c "$CONFIG_S3_PATH"
      - bash scripts/docker_build_push.sh -c "$PIPELINE_NAME" -e "$ECR_REPOSITORY_NAME"
      - bash scripts/copy_data_manifest.sh

artifacts:
  files:
    - '**/*'
  secondary-artifacts:
    BuildOutputCDK:
      base-directory: $CODEBUILD_SRC_DIR
      files:
        - '**/*'
      exclude-paths:
        - '*/**/*/.venv/**/*' 
        - '*/**/*/*_cache*/**/*'
    BuildOutputML:
      base-directory: $CODEBUILD_SRC_DIR_SourceMLCodeOutput
      files:
        - '**/*'
      exclude-paths:
        - '.venv/**/*'
        - '*_cache*/**/*'
        - '*/.venv/**/*'
        - '*/*_cache*/**/*'
