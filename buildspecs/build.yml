version: 0.2

env:
  variables:
    nodeversion: 18
    pythonversion: 3.10
  
  parameter-store:
    AWS_ACCESS_KEY_ID: /CodeBuild/AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: /CodeBuild/AWS_SECRET_ACCESS_KEY

phases:
  install:
    runtime-versions:
      python: $pythonversion
      nodejs: $nodeversion
  
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - docker login -u AWS -p $(aws ecr get-login-password --region $AWS_DEFAULT_REGION) $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com > /dev/null 2>&1
      - export PIPELINE_NAME=`echo $CODEBUILD_INITIATOR | cut -c14-`
      - export TRIGGER_CONNECTION=$(aws codepipeline list-pipeline-executions --pipeline-name $PIPELINE_NAME --max-results 1 | jq -r ".pipelineExecutionSummaries[].trigger.triggerDetail | fromjson? | .connectionArn // empty")
      - export TRIGGER_TAG=$(aws codepipeline list-pipeline-executions --pipeline-name $PIPELINE_NAME --max-results 1 | jq -r ".pipelineExecutionSummaries[].trigger.triggerDetail | fromjson? | .tagName // empty")

  build:
    commands:
      - bash scripts/ci.sh
      - bash scripts/build_deploy.sh
      - bash scripts/docker_build_push.sh
      - bash scripts/copy_data_manifest.sh

artifacts:
  files:
    - '**/*'
  secondary-artifacts:
    BuildOutputCDK:
      base-directory: $CODEBUILD_SRC_DIR
      files:
        - '**/*'
      exclude-paths:
        - '*/**/*/.venv/**/*' 
        - '*/**/*/*_cache*/**/*'
    BuildOutputML:
      base-directory: $CODEBUILD_SRC_DIR_SourceMLCodeOutput
      files:
        - '**/*'
      exclude-paths:
        - '.venv/**/*'
        - '*_cache*/**/*'
        - '*/.venv/**/*'
        - '*/*_cache*/**/*'
