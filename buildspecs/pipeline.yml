version: 0.2

env:
  variables:
    pythonversion: 3.10
  
  parameter-store:
    AWS_ACCESS_KEY_ID: /CodeBuild/AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: /CodeBuild/AWS_SECRET_ACCESS_KEY

phases:
  install:
    runtime-versions:
      python: $pythonversion

  build:
    commands:
      - bash $CODEBUILD_SRC_DIR_BuildOutputML/aws_sagemaker/run_pipeline.sh

artifacts:
  base-directory: $CODEBUILD_SRC_DIR_BuildOutputML/aws_sagemaker
  files:
    - 'pipelineExecution.json'