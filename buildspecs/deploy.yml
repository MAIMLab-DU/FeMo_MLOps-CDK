version: 0.2

env:
  variables:
    nodeversion: 18
    pythonversion: 3.10

phases:
  install:
    runtime-versions:
      python: $pythonversion
      nodejs: $nodeversion

  build:
    commands:
      - bash scripts/build_deploy.sh -c "$CONFIG_S3_PATH"
      - bash scripts/deploy.sh

artifacts:
  files:
    - '**/*'
  exclude:
    - 'cdk.out/'
    - 'node_modules/'
    - '**/*/cdk.out/'
    - '**/*/node_modules/'