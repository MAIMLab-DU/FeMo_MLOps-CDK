name: Build and Deploy Latest Model

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
    paths:
      - model_deploy/**
  pull_request:
    branches:
      - dev
    paths:
      - model_deploy/**

jobs:
  deploy-stack:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Node.js and Yarn
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install AWS CLI v2
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          aws --version

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Build Deployment Stack
        run: |
          set -e  # Exit immediately if a command fails

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            TARGET_BRANCH="${{ github.base_ref }}"
          else
            TARGET_BRANCH="${{ github.ref_name }}"
          fi

          mkdir -p configuration

          if [[ "$TARGET_BRANCH" == "dev" ]]; then
            bash scripts/create_aws_profile.sh -p "${{ secrets.DEV_AWS_PROFILE }}" -i "${{ secrets.DEV_ACCESS_KEY_ID }}" -k "${{ secrets.DEV_SECRET_ACCESS_KEY }}" -r "${{ secrets.DEV_REGION }}"
            if ! aws s3 cp "${{ secrets.DEV_CONFIG_PATH }}" configuration/projectConfig.json --profile "${{ secrets.DEV_AWS_PROFILE }}"; then
              echo "Error: Failed to download projectConfig.json from DEV S3 path."
              exit 1
            fi
            bash scripts/build_deploy.sh -p "${{ secrets.DEV_AWS_PROFILE }}"

          elif [[ "$TARGET_BRANCH" == "main" ]]; then
            bash scripts/create_aws_profile.sh -p "${{ secrets.PROD_AWS_PROFILE }}" -i "${{ secrets.PROD_ACCESS_KEY_ID }}" -k "${{ secrets.PROD_SECRET_ACCESS_KEY }}" -r "${{ secrets.PROD_REGION }}"
            if ! aws s3 cp "${{ secrets.PROD_CONFIG_PATH }}" configuration/projectConfig.json --profile "${{ secrets.PROD_AWS_PROFILE }}"; then
              echo "Error: Failed to download projectConfig.json from PROD S3 path."
              exit 1
            fi
            bash scripts/build_deploy.sh -p "${{ secrets.PROD_AWS_PROFILE }}"

          else
            echo "Unsupported branch: $TARGET_BRANCH"
            exit 1
          fi

      - name: Deploy Latest Model to AWS
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -e
          projectName=$(cat ./configuration/projectConfig.json | jq -r ".projectName")
          if [[ "${{ github.ref_name }}" == "dev" ]]; then
            bash scripts/deploy.sh -c "${projectName}-MLOpsInfraStack-*" -p "${{ secrets.DEV_AWS_PROFILE }}"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            bash scripts/deploy.sh -c "${projectName}-MLOpsInfraStack-*" -p "${{ secrets.PROD_AWS_PROFILE }}"
          else
            echo "Unsupported branch: ${{ github.ref_name }}"
            exit 1
