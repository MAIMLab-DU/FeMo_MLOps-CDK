version: 0.2

env:
  variables:
    nodeversion: 18
    pythonversion: 3.10
  
  parameter-store:
    AWS_ACCESS_KEY_ID: /CodeBuild/AWS_ACCESS_KEY_ID
    AWS_SECRET_ACCESS_KEY: /CodeBuild/AWS_SECRET_ACCESS_KEY

phases:
  install:
    runtime-versions:
      python: $pythonversion
      nodejs: $nodeversion

  build:
    commands:
      - bash scripts/ci.sh
      - bash scripts/copy_data_manifest.sh

artifacts:
  files:
    - '**/*'
  secondary-artifacts:
    BuildOutputCDK:
      base-directory: $CODEBUILD_SRC_DIR
      files:
        - '**/*'
      exclude-paths:
        - '*/**/*/.venv/**/*' 
        - '*/**/*/*_cache*/**/*'
    BuildOutputML:
      base-directory: $CODEBUILD_SRC_DIR_SourceMLCodeOutput
      files:
        - '**/*'
      exclude-paths:
        - '.venv/**/*'
        - '*_cache*/**/*'

