version: 0.2

env:
  variables:
    pythonversion: 3.10

phases:
  install:
    runtime-versions:
      python: $pythonversion

  pre_build:
    commands:
      - export PIPELINE_NAME=`echo $CODEBUILD_INITIATOR | cut -c14-`

  build:
    commands:
      - bash scripts/ml_pipeline.sh -c "$PIPELINE_NAME"

artifacts:
  base-directory: $CODEBUILD_SRC_DIR_BuildOutputML/aws_sagemaker
  files:
    - 'pipelineExecution_belt*.json'